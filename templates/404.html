{% extends 'base.html' %}

{% block content %}
<main class="flex-1 max-w-7xl mx-auto px-6 sm:px-10 py-24 w-full flex flex-col items-center justify-center text-center">
    <div class="mb-8 relative">
        <div class="absolute inset-0 bg-primary/10 blur-3xl rounded-full"></div>
        <h1 class="font-serif text-[120px] leading-none text-foreground font-bold relative z-10 opacity-90">404</h1>
    </div>
    
    <h2 class="font-serif text-3xl sm:text-4xl text-foreground font-bold mb-4">Page Not Found</h2>
    <p class="text-muted-foreground text-sm max-w-md mx-auto mb-10">
        We couldn't find the page you were looking for. It might have been removed, renamed, or didn't exist in the first place.
    </p>
    
    <a href="{% url 'home' %}" class="inline-flex items-center gap-2 px-8 py-3.5 text-xs uppercase tracking-[0.2em] font-bold bg-primary text-white hover:opacity-90 transition-opacity shadow-lg rounded-sm">
        <i class="fa-solid fa-arrow-left"></i> Return to Home
    </a>
</main>
{% endblock %}
